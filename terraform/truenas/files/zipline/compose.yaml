---
services:
  zipline:
    container_name: zipline
    image: ghcr.io/diced/zipline:latest
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://zipline:${ZIPLINE_DB_PASSWORD}@zipline-db:5432/zipline
      - CORE_SECRET=${ZIPLINE_CORE_SECRET}
    volumes:
      - /mnt/tank/Apps/Zipline/uploads:/zipline/uploads
      - /mnt/tank/Apps/Zipline/public:/zipline/public
      - /mnt/tank/Apps/Zipline/themes:/zipline/themes
    depends_on:
      zipline-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://0.0.0.0:3000/api/healthcheck"]
      interval: 15s
      timeout: 2s
      retries: 2
    networks: ["zipline_network"]

  zipline-db:
    container_name: zipline-db
    image: docker.io/postgres:18.4-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=zipline
      - POSTGRES_PASSWORD=${ZIPLINE_DB_PASSWORD}
      - POSTGRES_DB=zipline
    volumes:
      - zipline-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zipline"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: ["zipline_network"]

  cloudflared:
    container_name: zipline-cloudflared
    image: docker.io/cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${ZIPLINE_TUNNEL_TOKEN}
    depends_on:
      - zipline
    networks: ["zipline_network"]

networks:
  zipline_network:
    driver: bridge

volumes:
  zipline-db-data:
    driver: local
