---
configs:
  zot-config:
    content: |
      ${zot_config}
  zot-htpasswd:
    content: |
      ${ZOT_HTPASSWD_LINE}

services:
  # No healthcheck: the zot image is fully distroless (no shell, no wget/curl,
  # not even `ls`) -- there's no tool available inside the container to run
  # one. TrueNAS's app-state polling waits on Docker's health status when a
  # HEALTHCHECK is defined, so a broken one here caused "Timeout Waiting for
  # App State" on create even though the container itself was fine.
  zot:
    container_name: zot
    image: ghcr.io/project-zot/zot-linux-amd64:latest
    restart: unless-stopped
    command: ["serve", "/etc/zot/config.json"]
    configs:
      - source: zot-config
        target: /etc/zot/config.json
      - source: zot-htpasswd
        target: /etc/zot/htpasswd
    volumes:
      - /mnt/tank/Apps/Zot/data:/var/lib/registry
    expose: ["5000"]
    networks: ["traefik_network"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zot.rule=Host(`zot.nas.svc.h.mirceanton.com`)"
      - "traefik.http.routers.zot.entrypoints=websecure"
      - "traefik.http.routers.zot.tls.certresolver=cloudflare"
      - "traefik.http.routers.zot.service=zot"
      - "traefik.http.services.zot.loadbalancer.server.port=5000"

networks:
  traefik_network:
    external: true
