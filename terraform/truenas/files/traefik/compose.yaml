networks:
    traefik_network:
        driver: bridge
        name: traefik_network
services:
    traefik:
        command:
            - --configfile=
            - --api.dashboard=true
            - --api.insecure=false
            - --entrypoints.web.address=:80
            - --entrypoints.web.http.redirections.entrypoint.to=websecure
            - --entrypoints.web.http.redirections.entrypoint.scheme=https
            - --entrypoints.websecure.address=:443
            - --providers.docker=true
            - --providers.docker.endpoint=unix:///var/run/docker.sock
            - --providers.docker.exposedbydefault=false
            - --providers.docker.network=traefik_network
            - --certificatesresolvers.cloudflare.acme.email=business@mirceanton.com
            - --certificatesresolvers.cloudflare.acme.storage=/acme.json
            - --certificatesresolvers.cloudflare.acme.dnschallenge=true
            - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
            - --certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53
            - --certificatesresolvers.cloudflare.acme.dnschallenge.delaybeforecheck=30
            - --log.level=INFO
            - --accesslog=true
            - --accesslog.bufferingsize=100
            - --metrics.prometheus=true
            - --metrics.prometheus.addentrypointslabels=true
            - --metrics.prometheus.addserviceslabels=true
        container_name: traefik
        environment:
            - TZ=Europe/Bucharest
            - CF_DNS_API_TOKEN=${TRAEFIK_CF_DNS_API_TOKEN}
        image: docker.io/traefik:v3.7.11
        labels:
            - traefik.enable=true
            - traefik.http.routers.traefik.rule=Host(`nas.svc.h.mirceanton.com`)
            - traefik.http.routers.traefik.entrypoints=websecure
            - traefik.http.routers.traefik.tls.certresolver=cloudflare
            - traefik.http.routers.traefik.service=api@internal
            - traefik.http.routers.traefik.middlewares=traefik-auth
            - traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_BASIC_AUTH}
        networks:
            - traefik_network
        ports:
            - 10.0.10.245:80:80
            - 10.0.10.245:443:443
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        volumes:
            - acme:/etc/traefik
            - /var/run/docker.sock:/var/run/docker.sock:ro
volumes:
    acme: {}
